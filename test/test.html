];
const speicher = {};
window.wsLog = [];
window.dienste = [];
window.dienstDaten = [];
window.hass = { states, callService: async (domain, dienst, data) => {
  dienste.push(`${domain}.${dienst}:${data.entity_id}`);
  dienstDaten.push({ domain, dienst, ...data });
  setTimeout(() => {
    const neu = { ...window.hass.states };
    const alt = neu[data.entity_id] || { entity_id: data.entity_id, attributes: {} };
    if (dienst === "set_value") neu[data.entity_id] = { ...alt, state: String(data.value) };
    else if (dienst === "set_percentage") neu[data.entity_id] = { ...alt, state: data.percentage > 0 ? "on" : "off", attributes: { ...alt.attributes, percentage: data.percentage } };
    else if (domain === "fan" && dienst === "turn_off") neu[data.entity_id] = { ...alt, state: "off", attributes: { ...alt.attributes, percentage: 0 } };
    else neu[data.entity_id] = { ...alt, state: dienst === "turn_on" ? "on" : "off" };

    window.el.hass = window.hass;
  }, 600);
}, callWS: async (m) => {
  wsLog.push(m.type + (m.key ? ":" + m.key : ""));

    if (m.entity_ids.length > 1) {

      for (let k = 0; k < 6; k++) {
        const t = t0 + k * 36000, d = 70 + k * 8, b = 100 + k * 12;
        r[ziel].push({ s: "0", lu: t - 100 }, { s: "220", lu: t }, { s: "0", lu: t + 7200 });

        r[bist].push({ s: "23", lu: t - 100 }, { s: "53", lu: t + b }, { s: "30", lu: t + 7300 });
      }
      return r;
    }
    const id = m.entity_ids[0]; return { [id]: [{ s: "12.40" }, { s: "12.52" }, { s: "12.61" }] };
  }
  if (m.type === "media_source/browse_media") return { children: [{title: "Grundriss.png"}] };

}};
